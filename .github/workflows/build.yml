name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compila APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accetta le licenze dell'Android SDK (già installato sul runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Prove del gioco e dei filtri (JUnit)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compila (debug e release)
        # la release usa R8 e la firma: meglio scoprire qui eventuali problemi, prima del merge
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verifica i permessi dichiarati (l'app non deve avere INTERNET)
        run: |
          MANIFEST="$(find app/build/intermediates -path '*merged_manifests/debug*' -name AndroidManifest.xml | head -n1)"
          echo "Manifest: $MANIFEST"
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$MANIFEST" || true
          if grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::L'app dichiara il permesso INTERNET"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DapGalleria-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
