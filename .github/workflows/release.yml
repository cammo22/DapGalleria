name: Release

# Si avvia da solo in tre casi:
#  - quando viene pubblicato un tag "vX.Y.Z" (git tag v1.2.0 && git push origin v1.2.0)
#  - quando su main cambia il file VERSION (es. dopo il merge di una PR): il tag vX.Y.Z viene creato da solo
#  - a mano da Actions > Release > Run workflow
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da pubblicare (es. v1.0.0). Se non esiste viene creato sul branch scelto."
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Compila e pubblica la release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determina il tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "La release $TAG esiste già: niente da fare."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - if: env.SKIP != 'true'
        name: Accetta le licenze dell'Android SDK (già installato sul runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - if: env.SKIP != 'true'
        uses: gradle/actions/setup-gradle@v4

      - if: env.SKIP != 'true'
        name: Calcola versione
        run: |
          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))" >> "$GITHUB_ENV"

      - if: env.SKIP != 'true'
        name: Prepara la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Uso la chiave di firma salvata nei Secrets del repository."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            echo "SIGNING_KIND=secrets" >> "$GITHUB_ENV"
          else
            echo "Nessun Secret di firma: genero una chiave temporanea per questa release."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS="dapgalleria"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=DapGalleria, O=DapGalleria, C=IT"
            echo "SIGNING_KIND=temporary" >> "$GITHUB_ENV"
          fi
          {
            echo "DAP_KEYSTORE_FILE=$KEYSTORE"
            echo "DAP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "DAP_KEY_ALIAS=$KEY_ALIAS"
            echo "DAP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - if: env.SKIP != 'true'
        name: Compila l'APK di release
        run: >
          ./gradlew assembleRelease --stacktrace
          -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - if: env.SKIP != 'true'
        name: Rinomina e calcola il checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DapGalleria-$TAG.apk"
          (cd dist && sha256sum "DapGalleria-$TAG.apk" > "DapGalleria-$TAG.apk.sha256")
          ls -lh dist

      - if: env.SKIP != 'true'
        name: Pubblica la release su GitHub
        run: |
          {
            echo "## Installazione"
            echo
            echo "1. Scarica **DapGalleria-$TAG.apk** qui sotto dal tuo telefono Android."
            echo "2. Aprilo e consenti l'installazione da questa fonte quando Android lo chiede."
            echo "3. Concedi l'accesso a foto e video e inizia a fare swipe."
            echo
            echo "Richiede Android 8.0 o successivo."
            if [ "$SIGNING_KIND" = "temporary" ]; then
              echo
              echo "> L'APK è firmato con una chiave generata automaticamente per questa release: per aggiornare da una versione precedente"
              echo "> potrebbe servire disinstallarla prima. Per avere sempre la stessa firma, imposta i Secrets descritti nel README."
            fi
            echo
            echo "---"
            echo
          } > release-notes.md
          gh release create "$TAG" "dist/DapGalleria-$TAG.apk" "dist/DapGalleria-$TAG.apk.sha256" \
            --title "DapGalleria $TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "${GITHUB_SHA}"
